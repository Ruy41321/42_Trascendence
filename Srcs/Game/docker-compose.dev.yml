version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: pong-backend-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
    restart: unless-stopped
    networks:
      - pong-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pong-frontend-dev
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:3000
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pong-network

networks:
  pong-network:
    driver: bridge
