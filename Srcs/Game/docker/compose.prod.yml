# ===========================================
# PRODUCTION DOCKER COMPOSE
# ===========================================
# Usage: docker compose -f docker/compose.prod.yml up -d
# Or:    make prod
#
# Features:
#   - HTTPS enabled (SSL certificates required)
#   - Optimized builds (minified, tree-shaking)
#   - Nginx serves static files over HTTPS
#   - Health checks enabled
#   - No source code mounted (baked into images)
#   - Frontend: https://localhost (443 → 443)
#   - Backend WSS: wss://localhost:3000

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/prod/backend.Dockerfile
      args:
        - PORT=${PORT:-3000}
    container_name: pong-backend
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    volumes:
      - ./certs:/app/certs:ro
    restart: unless-stopped
    networks:
      - pong-network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/prod/frontend.Dockerfile
      args:
        - VITE_PORT=${PORT:-3000}
    container_name: pong-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pong-network

networks:
  pong-network:
    driver: bridge
