services:
  postgres:
    image: postgres:15-alpine
    container_name: transcendence_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - transcendence

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: transcendence_auth
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      API_V1_STR: ${API_V1_STR}
      PROJECT_NAME: ${PROJECT_NAME}
      VERSION: ${VERSION}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "8001:8000"
    volumes:
      - ./backend/auth-service:/app
    networks:
      - transcendence
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  game-service:
      build:
        context: ./backend/game-service
        dockerfile: Dockerfile
      container_name: transcendence_game
      depends_on:
        - auth-service
      ports:
        - "8002:8000"
      volumes:
        - ./backend/game-service:/app
      networks:
        - transcendence
      command: uvicorn backend:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  transcendence:
    driver: bridge