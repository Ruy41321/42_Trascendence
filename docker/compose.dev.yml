# ===========================================
# DEVELOPMENT DOCKER COMPOSE
# ===========================================
# Usage: docker compose -f docker/compose.dev.yml up -d
# Or:    make dev
#
# Features:
#   - HTTPS/WSS enabled (with self-signed certs)
#   - Hot reload enabled
#   - Source code mounted as volumes
#   - Debug tools available
#   - Vite dev server on port 5173
#
# Network topology:
#   app-network:  frontend <-> game-service <-> auth-service
#   db-network:   auth-service <-> postgres

services:
  # ── DATABASE ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: transcendence-postgres-dev
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - db-network

  # ── AUTH SERVICE ──────────────────────────────────
  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: ../../docker/dev/auth.Dockerfile
    container_name: transcendence-auth-dev
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      API_V1_STR: ${API_V1_STR}
      PROJECT_NAME: ${PROJECT_NAME}
      VERSION: ${VERSION}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    volumes:
      - ../backend/auth-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
      - db-network

  # ── GAME SERVICE (WebSocket backend) ──────────────
  game-service:
    build:
      context: ../Srcs/backend
      dockerfile: ../../docker/dev/backend.Dockerfile
      args:
        - PORT=${GAME_SERVICE_PORT:-3000}
    container_name: pong-game-service-dev
    ports:
      - "${GAME_SERVICE_PORT:-3000}:${GAME_SERVICE_PORT:-3000}"
    environment:
      - PORT=${GAME_SERVICE_PORT:-3000}
      - AUTH_SERVICE_HOST=auth-service
      - AUTH_SERVICE_INTERNAL_PORT=${AUTH_SERVICE_INTERNAL_PORT:-8000}
    volumes:
      - ../Srcs/backend/main.py:/app/main.py
      - ../Srcs/backend/requirements.txt:/app/requirements.txt:ro
      - ./certs:/app/certs:ro
    depends_on:
      - auth-service
    restart: unless-stopped
    networks:
      - app-network

  # ── FRONTEND ──────────────────────────────────────
  frontend:
    build:
      context: ../Srcs/frontend
      dockerfile: ../../docker/dev/frontend.Dockerfile
      args:
        - VITE_PORT=${GAME_SERVICE_PORT:-3000}
    container_name: pong-frontend-dev
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"
    environment:
      - VITE_PORT=${GAME_SERVICE_PORT:-3000}
      - BACKEND_HOST=pong-game-service-dev
      - AUTH_SERVICE_HOST=transcendence-auth-dev
    volumes:
      - ../Srcs/frontend/src:/app/src:ro
      - ../Srcs/frontend/index.html:/app/index.html:ro
      - ../Srcs/frontend/vite.config.js:/app/vite.config.js:ro
      - ./certs:/app/certs:ro
    depends_on:
      - game-service
      - auth-service
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
  db-network:
    driver: bridge
